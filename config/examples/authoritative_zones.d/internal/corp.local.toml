# corp.local zone file (文件名即区名)
default_ttl = 60

[soa]
mname = "ns1.corp.local"
rname = "hostmaster.corp.local"
serial = 2026051301
refresh = 3600
retry = 900
expire = 604800
minimum_ttl = 60

[[records]]
qname = "api.corp.local"
qtype = "A"
answer = "10.0.0.10"
ttl = 60

[[records]]
qname = "www.corp.local"
qtype = "CNAME"
answer = "api.corp.local"
ttl = 60
