listen = "127.0.0.1:9080"
request_timeout_ms = 2000
refresh_interval_secs = 10

[storage]
enabled = true
sqlite_path = "data/platform.sqlite3"
bootstrap_from_config = true

[backup]
enabled = false
interval_secs = 3600
retention_count = 30
backup_dir = "backups/platform"
replica_dir = ""
replica_retry_count = 2

[[instances]]
id = "local-dev"
name = "Local CogniDNS"
admin_url = "http://127.0.0.1:8080"
token = "changeme"
control_listen = "127.0.0.1:19090"
control_token = "changeme"
environment = "dev"
region = "local"
tags = [
    "local",
    "demo",
]

[[instances]]
id = "vm-1"
name = "vm-1"
admin_url = "http://192.168.48.129:8080"
token = "vm-1-comming"
control_listen = "192.168.48.129:19090"
control_token = "vm-1-comming"
environment = "VMware"
region = "local"
tags = ["vm"]

[auth]
admin_token = "platform-admin-please-change"

[[auth.users]]
username = "viewer1"
token = "111111"
role = "viewer"

[[auth.users]]
username = "operator1"
token = "111111"
role = "operator"

[[auth.users]]
username = "admin1"
token = "111111"
role = "admin"
